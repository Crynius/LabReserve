<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="register.css"> 
</head>
<body>
<main>
<div class="contenedor">
    
    <!-- COLUMNA 1: El Robot original (Se mantiene idéntico) -->
    <div class="columna col1">
        <div class="robot-contenedor">
            <div class="robot-antena"><div class="robot-luz"></div></div>
            <div class="robot-cabeza">
                <div class="robot-pantalla">
                    <div class="robot-ojo izquierdo"></div>
                    <div class="robot-ojo derecho"></div>
                </div>
            </div>
            <div class="robot-sombra"></div>
        </div>
    </div>

    <!-- COLUMNA 2: Formulario de Registro Sin el campo Rol -->
    <div class="columna col2">
        <h2 class="titulo-login">Create Account</h2>
        <p class="sub-login">Join our tech ecosystem</p>
        
        <!-- Párrafo para alertas de contraseñas no coincidentes o errores -->
        <p id="msgRegister" class="mensaje-feedback" style="color: #ff4a4a; text-align: center; width: 100%; font-size: 14px; margin-bottom: 10px;"></p>

        <form id="formRegister">
            <!-- Fila 1: Nombre y Apellido -->
            <div class="grid-formulario">
                <div class="grupo-input">
                    <label for="nombre">First Name</label>
                    <input type="text" id="nombre" placeholder="John" required>
                </div>
                
                <div class="grupo-input">
                    <label for="apellido">Last Name</label>
                    <input type="text" id="apellido" placeholder="Doe" required>
                </div>
            </div>

            <!-- Fila 2: Correo (Ocupa todo el ancho) -->
            <div class="grupo-input">
                <label for="correo">Email Address</label>
                <input type="email" id="correo" placeholder="example@email.com" required>
            </div>

            <!-- Fila 3: Contraseña y Confirmación -->
            <div class="grid-formulario">
                <div class="grupo-input">
                    <label for="password_usuario">Password</label>
                    <input type="password" id="password_usuario" placeholder="••••••••" required>
                </div>

                <div class="grupo-input">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="btnRegister" class="btn-login">Sign Up</button>
        </form>

        <div class="registro-link">
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>

</div>
</main>
<script src="register.js"></script>
</body>
</html>
