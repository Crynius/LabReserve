<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
<main>
<div class="contenedor">
    
    
    <div class="columna col1">
        <div class="robot-contenedor">
            <!-- Antena del robot -->
            <div class="robot-antena">
                <div class="robot-luz"></div>
            </div>
           
            <div class="robot-cabeza">
                <div class="robot-pantalla">
                    <div class="robot-ojo izquierdo"></div>
                    <div class="robot-ojo derecho"></div>
                </div>
            </div>
            
            <div class="robot-sombra"></div>
        </div>
    </div>

    
    <div class="columna col2">
        <h2 class="titulo-login">Welcome Back!</h2>
        <p class="sub-login">Enter your login details</p>
        
        
        <p id="msgLogin" class="mensaje-feedback"></p>

        
        <form id="formLogin">
            <div class="grupo-input">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="grupo-input">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnLogin" class="btn-login">Log in</button>
        </form>

        <div class="registro-link">
            <p>Don't have an account? <a href="register.html">Sign up</a></p>
        </div>
    </div>

</div>
</main>

<script src="login.js"></script>
</body>
</html>
